
<div class="auth-container">

  <div class="login-card">

    <!-- Brand -->
    <div class="brand">

      <div class="brand-mark">
        G
      </div>

      <span class="brand-name">
        GUDU
      </span>

    </div>


    <!-- Header -->
    <div class="auth-header">

      <h1>
        Welcome back
      </h1>

      <p class="subtitle">
        Sign in to continue to GUDU
      </p>

    </div>


    <!-- ERROR MESSAGE -->
    @if (errorMessage) {

      <div
        class="error-message"
        role="alert"
      >

        <div class="error-icon">

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <circle
              cx="12"
              cy="12"
              r="9"
            />

            <path
              d="M12 8v5"
            />

            <circle
              cx="12"
              cy="16.5"
              r=".7"
              fill="currentColor"
              stroke="none"
            />
          </svg>

        </div>

        <div class="error-content">

          <strong>
            Login failed
          </strong>

          <span>
            {{ errorMessage }}
          </span>

        </div>

      </div>

    }


    <!-- LOGIN FORM -->
    <form
      (ngSubmit)="login()"
    >

      <!-- EMAIL -->
      <div class="form-group">

        <label for="email">
          Email address
        </label>

        <div class="input-wrapper">

          <span class="input-icon">

            <svg viewBox="0 0 24 24">

              <path
                d="M4 6h16c1.1 0 2 .9 2 2v8c0 1.1-.9 2-2-2H4c-1.1 0-2-.9-2-2V8c0-1.1.9-2 2-2Z"
              />

              <path
                d="m3 7 9 6 9-6"
              />

            </svg>

          </span>


          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />

        </div>

      </div>


      <!-- PASSWORD -->
      <div class="form-group">

        <div class="password-label">

          <label for="password">
            Password
          </label>

          <a
            routerLink="/forgot-password"
            class="forgot-link"
          >
            Forgot password?
          </a>

        </div>


        <div class="input-wrapper">

          <span class="input-icon">

            <svg viewBox="0 0 24 24">

              <rect
                x="4"
                y="10"
                width="16"
                height="11"
                rx="2"
              />

              <path
                d="M8 10V7a4 4 0 0 1 8 0v3"
              />

              <circle
                cx="12"
                cy="15.5"
                r="1"
              />

            </svg>

          </span>


          <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />

        </div>

      </div>


      <!-- LOGIN BUTTON -->
      <button
        type="submit"
        class="login-button"
        [disabled]="isLoading"
        [attr.aria-busy]="isLoading"
      >

        @if (isLoading) {

          <span class="spinner"></span>

          <span>
            Signing in...
          </span>

        } @else {

          <span>
            Login
          </span>

          <svg
            class="button-arrow"
            viewBox="0 0 24 24"
          >

            <path d="M5 12h14" />

            <path d="m13 6 6 6-6 6" />

          </svg>

        }

      </button>

    </form>


    <!-- REGISTER -->
    <div class="register-section">

      <span>
        Don't have an account?
      </span>

      <a routerLink="/register">
        Create account
      </a>

    </div>


    <!-- SECURITY -->
    <div class="secure-note">

      <svg viewBox="0 0 24 24">

        <path
          d="M12 3 5 6v5c0 4.5 2.9 8.5 7 10 4.1-1.5 7-5.5 7-10V6l-7-3Z"
        />

        <path
          d="m9 12 2 2 4-4"
        />

      </svg>

      <span>
        Your information is secure
      </span>

    </div>

  </div>

</div>
